name: Publish to npm (rombik-engine + rombik)

# Запуск: кнопкою (Actions → цей workflow → Run workflow) АБО при публікації GitHub Release.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance — значок «зібрано з цього репо/коміту»

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: esbuild binary
        run: npm rebuild esbuild

      - name: Tests (rombik-engine)
        run: npm test --workspace rombik-engine

      # prepublishOnly у кожному пакеті сам збере dist/. --provenance вимагає id-token: write.
      # Пропускаємо пакет, якщо його версія вже опублікована (щоб реліз/повтор не падали 403).
      - name: Publish rombik-engine (idempotent)
        run: |
          VER=$(node -p "require('./packages/engine/package.json').version")
          if npm view "rombik-engine@$VER" version >/dev/null 2>&1; then
            echo "rombik-engine@$VER вже на npm — пропускаю."
          else
            npm publish --workspace rombik-engine --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish rombik CLI (idempotent)
        run: |
          VER=$(node -p "require('./packages/cli/package.json').version")
          if npm view "rombik@$VER" version >/dev/null 2>&1; then
            echo "rombik@$VER вже на npm — пропускаю."
          else
            npm publish --workspace rombik --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
